# Publishes the shared TG-263 templates as TemplateSnapshots/TG263.json so the program can
# download them over plain HTTPS without an Airtable token. Each run costs one Airtable API call
# per 100 records (3 calls for 246 records), instead of every user spending ~250 calls per load.
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   secret   AIRTABLE_PAT      a personal access token with data.records:read on the TG-263 base only
#   variable TG263_BASE_ID     optional, defaults to app5LkQceQZAPhBJx (the maintainers' TG-263 base)
#   variable TG263_TABLE_ID    optional, defaults to tblex7IPsmm8hvVEc
# GitHub disables scheduled workflows in public repositories after 60 days without repository
# activity; re-enable it from the Actions tab, or run it manually, if that happens.
name: Refresh TG-263 template snapshot

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-template-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # only the final push uses it
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Restore and build without the Airtable secret in the environment.
      - name: Build the export tool
        run: dotnet build TemplateSnapshotTool -c Release

      # TEMPORARY: diagnose why Airtable rejects the token. Prints no token or record data.
      - name: Diagnose Airtable access
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          BASE_ID: ${{ vars.TG263_BASE_ID || 'app5LkQceQZAPhBJx' }}
          TABLE_ID: ${{ vars.TG263_TABLE_ID || 'tblex7IPsmm8hvVEc' }}
        run: |
          yn() { if eval "$1"; then echo yes; else echo no; fi; }
          echo "Token length: ${#AIRTABLE_PAT}"
          echo "Starts with 'pat': $(yn '[[ $AIRTABLE_PAT == pat* ]]')"
          echo "Contains a dot: $(yn '[[ $AIRTABLE_PAT == *.* ]]')"
          echo "Contains whitespace or line breaks: $(yn '[[ $AIRTABLE_PAT =~ [[:space:]] ]]')"
          auth="Authorization: Bearer $AIRTABLE_PAT"
          code=$(curl -sS -o whoami.json -w '%{http_code}' -H "$auth" https://api.airtable.com/v0/meta/whoami)
          echo "whoami: HTTP $code; scopes/error: $(jq -c '{scopes, error}' whoami.json)"
          code=$(curl -sS -o bases.json -w '%{http_code}' -H "$auth" https://api.airtable.com/v0/meta/bases)
          if [ "$code" = 200 ]; then
            echo "Bases this token can reach: $(jq '.bases | length' bases.json); includes $BASE_ID: $(jq --arg b "$BASE_ID" 'any(.bases[]; .id == $b)' bases.json)"
            echo "Reachable base ids and your permission on each: $(jq -c '[.bases[] | {id, permissionLevel}]' bases.json)"
            for b in $(jq -r '.bases[].id' bases.json); do
              code=$(curl -sS -o read.json -w '%{http_code}' -H "$auth" "https://api.airtable.com/v0/$b/$TABLE_ID?maxRecords=1")
              echo "Table $TABLE_ID in $b: HTTP $code"
            done
          else
            echo "List bases: HTTP $code (needs schema.bases:read; not required for the export)"
          fi
          code=$(curl -sS -o read.json -w '%{http_code}' -H "$auth" "https://api.airtable.com/v0/$BASE_ID/$TABLE_ID?maxRecords=1")
          echo "Read one record from $BASE_ID/$TABLE_ID: HTTP $code; error: $(jq -c '.error // "none"' read.json); records returned: $(jq '.records | length // 0' read.json)"
          rm -f whoami.json bases.json read.json

      - name: Export snapshot from Airtable
        id: export
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          BASE_ID: ${{ vars.TG263_BASE_ID || 'app5LkQceQZAPhBJx' }}
          TABLE_ID: ${{ vars.TG263_TABLE_ID || 'tblex7IPsmm8hvVEc' }}
        run: |
          if [ -z "$AIRTABLE_PAT" ]; then
            echo "::warning::The AIRTABLE_PAT secret is not set; skipping the snapshot refresh."
            exit 0
          fi
          # No columns are excluded: if the table lacks one of the mapped columns, the export costs
          # one extra call and downloads every column instead. Sorting by the autonumber "Record"
          # column fixes the record order, which Airtable leaves unspecified and which decides ROI
          # order within each template. Only mapped template columns are ever written to the public file.
          dotnet run --no-build --project TemplateSnapshotTool -c Release -- \
            --base "$BASE_ID" --table "$TABLE_ID" --name TG263 \
            --sort-field Record \
            --output TemplateSnapshots/TG263.json

      - name: Commit the snapshot if it changed
        if: steps.export.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TemplateSnapshots/TG263.json
          git commit -m "Refresh TG-263 template snapshot"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
