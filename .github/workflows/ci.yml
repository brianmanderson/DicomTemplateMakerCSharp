name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DicomTemplateMaker.sln

      # Warnings are errors (Directory.Build.props). The WPF app compiles on Linux too
      # (EnableWindowsTargeting), so both runners build the whole solution.
      - name: Build
        run: dotnet build DicomTemplateMaker.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution DicomTemplateMaker.sln -c Release --no-build

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format DicomTemplateMaker.sln --verify-no-changes --no-restore

  # Independent DICOM validation of the RT Structure Sets the program generates: builds the 53 TG-263 sites
  # from the frozen snapshot, writes one RT per site on the bundled sample CT, then runs dciodvfy
  # (dicom3tools) and validate_iods (dicom-validator), and the TPS-realism rules of the evaluation tool's realism
  # command. Errors must be covered by docs/evidence/validator-allowlist.json; warnings are reported in the uploaded
  # artifact.
  # It then C-STOREs every RT (and the CT slices it references) to an Orthanc container and reads the ROI
  # names, colours, types and codes back through Orthanc's REST API. That is a transfer and read-back check,
  # not a conformance oracle: Orthanc stores files the validators reject.
  dicom-validation:
    name: DICOM validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      orthanc:
        image: jodogne/orthanc:1.13.0
        ports:
          - 4242:4242
          - 8042:8042
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build the evaluation tool
        run: dotnet build TemplateEvaluationTool -c Release

      - name: Generate the RT Structure Sets
        id: generate
        run: |
          dotnet run --project TemplateEvaluationTool -c Release --no-build -- build-sites \
            --snapshot TemplateSync.Tests/TestData/TG263.2026-09-30.json --naming default \
            --data-dir "$RUNNER_TEMP/eval/data" --out "$RUNNER_TEMP/eval/sites"
          dotnet run --project TemplateEvaluationTool -c Release --no-build -- generate-rts \
            --sites "$RUNNER_TEMP/eval/sites" --images DicomTemplateMakerGUI/SmallCT --out "$RUNNER_TEMP/eval/rt"

      # Pinned on purpose: validate_iods --edition 2025b is the last edition in which the three ROI
      # sequences are Type 1, so an RT with zero ROIs fails (the script also reports the current edition).
      - name: Install the validators
        run: python -m pip install --disable-pip-version-check "dicom3tools==20260927" "dicom-validator==0.9.0" "pydicom==3.0.2" "pynetdicom==3.0.4"

      - name: Validate
        run: |
          python -I tools/dicom-validation/validate_rts.py --rt-dir "$RUNNER_TEMP/eval/rt" \
            --out "$RUNNER_TEMP/eval/validators" --allowlist docs/evidence/validator-allowlist.json

      # What planning systems require beyond the standard (RtRealismChecker, rules RR1-RR10). Runs even when the
      # standard validators fail, so both reports are in the artifact. Errors must be covered by a "realism" entry of
      # the allowlist; warnings are reported in realism.md.
      - name: Realism check
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          dotnet run --project TemplateEvaluationTool -c Release --no-build -- realism \
            --in "$RUNNER_TEMP/eval/rt" --out "$RUNNER_TEMP/eval/realism" --allowlist docs/evidence/validator-allowlist.json

      # Runs even when Validate failed, so a validator regression does not hide the transfer result.
      - name: Orthanc smoke test
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          # Orthanc is up once /system answers; 401 counts, the script logs in with the image's default user.
          up() { code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8042/system || true); [ "$code" = 200 ] || [ "$code" = 401 ]; }
          for i in $(seq 1 60); do up && break; sleep 2; done
          up || { echo "Orthanc did not start"; exit 1; }
          python -I tools/dicom-validation/orthanc_smoke.py --rt-dir "$RUNNER_TEMP/eval/rt" --out "$RUNNER_TEMP/eval/orthanc"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dicom-validation-reports
          path: |
            ${{ runner.temp }}/eval/validators
            ${{ runner.temp }}/eval/realism
            ${{ runner.temp }}/eval/orthanc
          if-no-files-found: warn

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Self-contained single-file build: users need no .NET runtime installed. Data files the program
      # reads at run time (template_RS.dcm, SmallCT, the TG-263 snapshot, ...) sit next to the exe.
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish DicomTemplateMakerGUI/DicomTemplateMakerGUI.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version `
            -o publish/DicomTemplateMaker
          if (-not (Test-Path publish/DicomTemplateMaker/TemplateSnapshots/TG263.json)) {
            Write-Warning "TemplateSnapshots/TG263.json is missing: run the snapshot workflow before releasing so offline users get the shared templates."
          }
          Compress-Archive -Path publish/DicomTemplateMaker/* -DestinationPath "DicomTemplateMaker-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "DicomTemplateMaker-${{ github.ref_name }}-win-x64.zip" --generate-notes --verify-tag
